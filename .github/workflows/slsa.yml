name: Pipeline CI/CD + SLSA

on:
  push:
  release:
    permissions:
      contents: write
    types: [published, released]

permissions:
  contents: read

jobs:

  # -------------------------------------------------------
  # JOB 1: BUILD SEGURO (Requerido por SLSA)
  # -------------------------------------------------------
  build:
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    runs-on: ubuntu-latest
    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@v2.7.0
        with:
          egress-policy: audit

      - run: echo "REPOSITORY_NAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Build artifacts
        run: |
          find *.sh functions/* tests/* Dockerfile Vagrantfile -exec sha256sum {} \; > ${{ env.REPOSITORY_NAME }}.sha256

      - name: Generate hashes
        id: hash
        run: |
          echo "hashes=$(sha256sum ${{ env.REPOSITORY_NAME }}.sha256 | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload SHA256 artifact
        uses: actions/upload-artifact@v4.3.1
        with:
          name: ${{ env.REPOSITORY_NAME }}.sha256
          path: ${{ env.REPOSITORY_NAME }}.sha256
          if-no-files-found: error


  # -------------------------------------------------------
  # JOB 2: PRUEBAS, SCAN Y LOGS
  # -------------------------------------------------------
  tests_and_security:
    runs-on: ubuntu-latest
    needs: build
    steps:

      - name: Checkout repo
        uses: actions/checkout@v4.1.1

      - name: Run integration tests
        run: |
          mkdir -p log
          chmod +x tests/*.sh
          for test_file in tests/*.sh; do
            echo "Running $test_file..." | tee -a log/tests.log
            bash "$test_file" >> log/tests.log 2>&1
          done

      - name: Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs
          path: log/
          if-no-files-found: warn



      - name: Create issue on failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: "Error detected in CI pipeline"
          content-filepath: ./log/error.log
          labels: bug


  # -------------------------------------------------------
  # JOB 3: PUBLISH DOCKER IMAGE (Solo si las pruebas pasan)
  # -------------------------------------------------------
  docker_publish:
    runs-on: ubuntu-latest
    needs: tests_and_security
    if: success()
    steps:

      - name: Checkout repo
        uses: actions/checkout@v4.1.1

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: Aquiless300/docker-bench-security:latest


  # -------------------------------------------------------
  # JOB 4: PROVENANCE SLSA
  # -------------------------------------------------------
  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.10.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/') }}


  # -------------------------------------------------------
  # JOB 5: RELEASE FINAL (solo tags)
  # -------------------------------------------------------
  release:
    permissions:
      actions: read
      id-token: write
      contents: write
    needs: [build, provenance]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:

      - run: echo "REPOSITORY_NAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV
        shell: bash

      - name: Download SHA256 artifact
        uses: actions/download-artifact@v4.1.4
        with:
          name: ${{ env.REPOSITORY_NAME }}.sha256

      - name: Upload asset to GitHub Release
        uses: softprops/action-gh-release@v2.0.4
        with:
          files: |
            ${{ env.REPOSITORY_NAME }}.sha256
